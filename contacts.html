    <title>Контакты - PlantGuide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 25%, #805ad5 50%, #2f855a 75%, #38a169 100%);
            min-height: 100vh;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #6b46c1 0%, #38a169 100%);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        header h1 { color: white; font-size: 3em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        header p { color: rgba(255,255,255,0.95); font-size: 1.3em; }
        nav {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: 600;
            font-size: 1.1em;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        nav a:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .container { max-width: 800px; margin: 0 auto; padding: 50px 20px; }
        .contact-card {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .contact-card h2 { color: #6b46c1; margin-bottom: 20px; font-size: 2em; }
        .contact-card p { font-size: 1.2em; line-height: 1.8; color: #555; }
        .contact-card a { color: #38a169; text-decoration: none; font-weight: bold; }
        .contact-card a:hover { text-decoration: underline; }
        footer {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }
        footer p { opacity: 0.9; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>📬 Контакты</h1>

    </header>

            <h2>Связаться с нами</h2>
            <p>Есть вопросы или предложения? Напишите нам!</p>
            <p>📧 Email: <a href="mailto:yaklx190@gmail.com">yaklx190@gmail.com</a></p>
            <p>🌿 Мы всегда рады обратной связи!</p>
        </div>
